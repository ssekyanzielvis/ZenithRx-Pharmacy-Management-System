<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Allow pinch-zoom on mobile (user-scalable=no was blocking accessibility) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZenithRx Patient" />
    <meta name="description" content="ZenithRx Patient Care &amp; Health Portal — Prescription upload, medicine search, chronic refill alerts &amp; teleconsultation" />
    <title>ZenithRx Patient Care &amp; Health Portal</title>

    <!-- Inline critical CSS for instant paint — no layout shift while JS loads -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body { background: #F4F7FB; color: #0f172a; min-height: 100vh; -webkit-font-smoothing: antialiased; }
      @media (prefers-color-scheme: dark) {
        body { background: #0B131F; color: #f1f5f9; }
        #app-shell { background: #0B131F; }
      }
      /* Instant loading shell — replaced by React once JS loads */
      #app-shell {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #F4F7FB; z-index: 9999; transition: opacity 0.3s ease;
        flex-direction: column; gap: 16px;
      }
      #app-shell.hidden { opacity: 0; pointer-events: none; }
      .shell-logo {
        width: 56px; height: 56px; border-radius: 16px;
        background: linear-gradient(135deg, #059669, #0d9488);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(5,150,105,0.4);
        animation: pulse-logo 1.8s ease-in-out infinite;
      }
      .shell-logo svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; }
      .shell-text { font-size: 13px; font-weight: 700; color: #059669; letter-spacing: 0.04em; }
      .shell-spinner {
        width: 32px; height: 32px; border: 3px solid rgba(5,150,105,0.2);
        border-top-color: #059669; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse-logo { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    </style>
  </head>
  <body>
    <!-- Instant loading shell (hidden once React mounts) -->
    <div id="app-shell">
      <div class="shell-logo">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
      </div>
      <div class="shell-text">ZenithRx Patient</div>
      <div class="shell-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide the loading shell once React mounts -->
    <script>
      // Remove shell once React has rendered content
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const shell = document.getElementById('app-shell');
          if (shell) {
            shell.classList.add('hidden');
            setTimeout(() => shell.remove(), 400);
          }
          observer.disconnect();
        }
      });
      const root = document.getElementById('root');
      if (root) observer.observe(root, { childList: true, subtree: false });
    </script>
  </body>
</html>
